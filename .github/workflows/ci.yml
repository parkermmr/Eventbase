name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      EVENTBASE_KAFKA: localhost:9092
      EVENTBASE_S3: http://localhost:9000
      AWS_ACCESS_KEY_ID: eventbase
      AWS_SECRET_ACCESS_KEY: eventbase-secret
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Start kafka
        run: docker run -d --name kafka -p 9092:9092 apache/kafka:latest

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true

      - name: Install
        run: uv pip install -e ".[all,dev]"

      - name: Start s3
        run: nohup moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &

      - name: Wait for kafka and s3
        run: |
          for _ in $(seq 60); do
            if docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 \
              && curl -s -o /dev/null http://localhost:9000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs kafka; cat moto.log
          exit 1

      - name: Test
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python == '3.13'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
