name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      EVENTBASE_KAFKA: localhost:9092
      EVENTBASE_S3: http://localhost:9000
      AWS_ACCESS_KEY_ID: eventbase
      AWS_SECRET_ACCESS_KEY: eventbase-secret
    steps:
      - uses: actions/checkout@v4

      - name: Start kafka and minio
        run: |
          docker run -d --name kafka -p 9092:9092 apache/kafka:latest
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            minio/minio server /data

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv pip install -e ".[all,dev]"

      - name: Wait for kafka and minio
        run: |
          for _ in $(seq 60); do
            if docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 \
              && curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs kafka; docker logs minio
          exit 1

      - name: Test
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python == '3.13'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
